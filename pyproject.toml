[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redcord"
version = "0.8.3"
description = "RedCord 0.8.3 writer desktop with contextual Word-like ribbon, improved BoC Lite art studio, custom dark colors and offline-first SQLite."
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "pypandoc>=1.13",
    "pyinstaller>=6.0",
    "fastapi>=0.111",
    "email-validator>=2.1",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["redcord*"]
exclude = ["commits*", "scripts*", "redcord_build*"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["redcord"]
